[package]
name = "cambium"
version = "0.1.0"
edition = "2021"
description = "Syncs Keycloak group membership into Nexus Repository 3 native User/Role assignments"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
urlencoding = "2"
rand = "0.8"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
